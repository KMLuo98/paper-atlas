<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#315b52">
  <meta name="description" content="Mail Atlas 私人多邮箱工作台">
  <link rel="canonical" href="https://kmluo98.github.io/mail/">
  <title>Mail Atlas · 邮件工作台</title>
  <style>body{margin:0;background:#f8f9f6}.boot{padding:32px;color:#315f53;font:calc(14px + 2pt)/1.8 -apple-system,'Microsoft YaHei',sans-serif}.boot button{font:inherit;color:inherit;padding:8px 16px;cursor:pointer}</style>
</head>
<body>
  <div id="app"><p class="boot">正在打开邮件工作台…</p></div>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p class="boot">请启用 JavaScript 后打开邮件工作台。</p></noscript>
  <script type="module">
    const showError=()=>{const app=document.getElementById('app');app.replaceChildren();const p=document.createElement('p');p.className='boot';p.append('暂时无法打开邮件工作台，请检查网络后重试。 ');const button=document.createElement('button');button.textContent='重新加载';button.onclick=()=>location.reload();p.append(button);app.append(p);};
    try{
      const response=await fetch('/paper-atlas/mail/entry.json',{cache:'no-store',signal:AbortSignal.timeout(20000)});
      if(!response.ok)throw Error('Entry unavailable');
      const entry=await response.json();
      const asset=value=>{const url=new URL(value,location.origin);if(url.origin!==location.origin||!url.pathname.startsWith('/paper-atlas/mail/assets/'))throw Error('Invalid asset');return url.href;};
      if(!entry.script||!Array.isArray(entry.styles)||!entry.styles.length)throw Error('Invalid entry');
      const scriptURL=asset(entry.script),styleURLs=entry.styles.map(asset),iconURL=asset(entry.icon);
      const icon=document.createElement('link');icon.rel='icon';icon.type='image/svg+xml';icon.href=iconURL;document.head.append(icon);
      await Promise.all(styleURLs.map(href=>new Promise((resolve,reject)=>{const link=document.createElement('link');link.rel='stylesheet';link.href=href;link.onload=resolve;link.onerror=reject;document.head.append(link);})));
      const script=document.createElement('script');script.type='module';script.src=scriptURL;script.onerror=showError;document.head.append(script);
    }catch{showError();}
  </script>
</body>
</html>
