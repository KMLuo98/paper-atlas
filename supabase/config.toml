project_id = "paper-atlas"

[functions.library-api]
# JWT and API tokens are verified inside the handler; login is the only anonymous action.
verify_jwt = false

[functions.mail-api]
# Every user action verifies Auth server-side; OAuth callbacks and scheduled sync use separate one-time/service-only credentials.
verify_jwt = false
[functions.manuscripts-api]
# Each action verifies the authenticated user in the handler.
verify_jwt = false
[functions.scheduled-mail]
# The handler verifies user JWTs or the private cron token itself.
verify_jwt = false
