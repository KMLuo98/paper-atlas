name: Verify cloud connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check-cloud.mjs
      - src/project-config.js
      - supabase/**
      - .github/workflows/cloud-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-cloud.mjs
